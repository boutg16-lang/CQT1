# OUSSAMA Cutter — docker compose (v7.20)
#
# Usage:
#   docker compose up --build        # build + start WebUI on :7860
#   docker compose down              # stop
#
# Persistence: ./VIRALS is mounted so downloaded videos and projects
# survive container restarts. Optionally mount ./models for local LLMs.

services:
  oussama-cutter:
    build: .
    container_name: oussama-cutter
    ports:
      - "7860:7860"
    volumes:
      - ./VIRALS:/app/VIRALS
      - ./models:/app/models
    environment:
      - VIRALCUTTER_HOST=0.0.0.0
      # Optional: pass API keys via .env (never commit them)
      # - VIRALCUTTER_GEMINI_KEY=${VIRALCUTTER_GEMINI_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
