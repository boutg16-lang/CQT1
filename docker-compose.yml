# OUSSAMA Cutter — docker compose (v7.20)
#
# Usage:
#   docker compose up --build        # build + start WebUI on :7860
#   docker compose down              # stop
#
# Persistence: ./VIRALS is mounted so downloaded videos and projects
# survive container restarts. Optionally mount ./models for local LLMs.

services:
  oussama-cutter:
    build: .
    container_name: oussama-cutter
    ports:
      - "7860:7860"
    volumes:
      - ./VIRALS:/app/VIRALS
      - ./models:/app/models
    environment:
      - VIRALCUTTER_HOST=0.0.0.0
      # Required: HTTP basic auth (fail fast if missing in .env)
      - VIRALCUTTER_WEBUI_USER=${VIRALCUTTER_WEBUI_USER:?set VIRALCUTTER_WEBUI_USER in .env}
      - VIRALCUTTER_WEBUI_PASSWORD=${VIRALCUTTER_WEBUI_PASSWORD:?set VIRALCUTTER_WEBUI_PASSWORD in .env}
      # Optional: pass API keys via .env (never commit them)
      # - VIRALCUTTER_GEMINI_KEY=${VIRALCUTTER_GEMINI_KEY:-}
    restart: unless-stopped
    healthcheck:
      # يعتبر 200 و401 دليلًا على أن الخادم يعمل (401 = المصادقة مفعّلة وتستقبل الطلب).
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
