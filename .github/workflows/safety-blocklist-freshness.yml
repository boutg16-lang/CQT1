name: Safety Blocklist Freshness

# Keeps the canonical safety blocklist (safety_blocklist.json) from going
# stale. YouTube's moderation vocabulary evolves constantly and the whole
# auto-update chain (scripts/safety_updater.py) is only as good as this file.
#
#   * Every Monday: if the pack is older than 14 days → open ONE reminder
#     issue (skipped if one is already open).
#   * On every push to main: if the pack is fresh → auto-close any open
#     reminder issue.
#
# Result: the maintainer gets nudged exactly when the list needs new terms,
# and the issue disappears by itself once v(N+1) lands. No spam.

on:
  schedule:
    - cron: "0 8 * * 1,4" # Mondays + Thursdays 08:00 UTC
  push:
    branches: [main]

concurrency:
  group: blocklist-freshness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Evaluate blocklist freshness
        id: eval
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json;print(json.load(open('safety_blocklist.json'))['version'])")"
          UPDATED="$(python3 -c "import json;print(json.load(open('safety_blocklist.json'))['updated'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "updated=$UPDATED" >> "$GITHUB_OUTPUT"
          STALE_SECONDS=$(( $(date -u +%s) - $(date -u -d "$UPDATED" +%s) ))
          echo "stale_seconds=$STALE_SECONDS" >> "$GITHUB_OUTPUT"
          echo "blocklist is v$VERSION, updated $UPDATED, stale ${STALE_SECONDS}s"

      - name: Open reminder issue when stale (14+ days)
        if: steps.eval.outputs.stale_seconds > 1209600
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OPEN=$(gh issue list --state open --search 'in:title "Safety-Update"' --limit 5 --json number -q '.[].number')
          if [ -n "$OPEN" ]; then
            echo "Reminder issue already open (#$OPEN)."
          else
            gh issue create \
              --title "[Safety-Update] قائمة الأمان قديمة (v${{ steps.eval.outputs.version }}, ${{ steps.eval.outputs.updated }}) — أضف كلمات جديدة" \
              --body "## 🔔 تذكير تلقائي — قائمة الأمان تحتاج تحديثاً

          آخر تحديث للقائمة الكنسية: **${{ steps.eval.outputs.updated }}** (الإصدار ${{ steps.eval.outputs.version }}).
          أكثر من 14 يوماً بلا كلمات جديدة — وكل تثبيت عند المستخدمين يسحب من هذا الملف، فالقائمة المتوقفة تعني حماية متوقفة.

          ### ماذا تفعل
          1. أضف الكلمات الجديدة المكتشفة (من الـ strikes، المجتمع، أو تحديثات يوتيوب) إلى قائمة \`BLOCKLIST\` في \`scripts/safety_filter.py\`.
          2. صدّر الحزمة برقم إصدار جديد:
             \`\`\`
             python scripts/export_blocklist_pack.py --version 2
             \`\`\`
          3. ادفع التغيير — وسيصدر التحديث تلقائياً لكل المستخدمين خلال 24 ساعة.

          > ملاحظة: يوتيوب لا ينشر قوائم كلمات رسمية؛ القائمة مصدرها المجتمع + نتائج الـ strikes، والمراجعة السياقية بالذكاء الاصطناعي (\`safety_ai.py\`) تبقى خط الدفاع الأساسي للكلمات غير المدرجة."
          fi

      - name: Auto-close reminder when a fresh pack lands
        if: steps.eval.outputs.stale_seconds <= 1209600
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for num in $(gh issue list --state open --search 'in:title "Safety-Update"' --limit 10 --json number -q '.[].number'); do
            gh issue close "$num" --comment "✅ القائمة محدثة الآن (v${{ steps.eval.outputs.version }}, ${{ steps.eval.outputs.updated }}) — شكراً!"
          done
