name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ffmpeg (real-video smoke tests)
        run: |
          sudo apt-get \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=2 \
            -o DPkg::Lock::Timeout=60 \
            update
          sudo apt-get \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=2 \
            -o DPkg::Lock::Timeout=60 \
            install -y ffmpeg
      - name: Upgrade pip installer
        run: python -m pip install --upgrade pip
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Ruff lint
        run: ruff check .
      - name: Audit dependencies
        run: |
          audit_status=0
          pip-audit --progress-spinner off --format json \
            --output pip-audit-${{ matrix.python-version }}.json || audit_status=$?
          if [[ "$audit_status" -gt 1 ]]; then
            echo "pip-audit failed operationally with exit code $audit_status"
            exit "$audit_status"
          fi
          python -m scripts.validate_dependency_audit \
            pip-audit-${{ matrix.python-version }}.json
      - name: Generate SBOM
        run: |
          sbom_status=0
          pip-audit --progress-spinner off --format cyclonedx-json \
            --output sbom-${{ matrix.python-version }}.json || sbom_status=$?
          if [[ "$sbom_status" -gt 1 ]]; then
            echo "SBOM generation failed operationally with exit code $sbom_status"
            exit "$sbom_status"
          fi
          python -c "import json; json.load(open('sbom-${{ matrix.python-version }}.json', encoding='utf-8'))"
      - name: Audit dependency licenses
        run: pip-licenses --fail-on="GPL;AGPL" --format=markdown --output-file=licenses-${{ matrix.python-version }}.md
      - name: Audit locked core runtime dependencies
        run: |
          python -m pip install uv==0.13.5
          uv export --locked --no-dev --no-emit-project --no-hashes --no-annotate --no-header --output-file runtime-requirements-${{ matrix.python-version }}.txt
          audit_status=0
          pip-audit --requirement runtime-requirements-${{ matrix.python-version }}.txt --no-deps --disable-pip --progress-spinner off --format json --output runtime-pip-audit-${{ matrix.python-version }}.json || audit_status=$?
          if [[ "$audit_status" -gt 1 ]]; then
            echo "Locked runtime pip-audit failed operationally with exit code $audit_status"
            exit "$audit_status"
          fi
          python -m scripts.validate_dependency_audit runtime-pip-audit-${{ matrix.python-version }}.json

      - name: Build package
        run: python -m build --wheel --sdist
      - name: Run deterministic quality benchmark
        run: python -m scripts.quality_benchmark --output quality-benchmark-${{ matrix.python-version }}.json
      - name: Run unit tests
        run: pytest -v
      # Upload LAST so a shared artifact-storage quota (issue #26) can never
      # hide the test result — previously this step failed the job before
      # pytest ran, making a green commit look red for no code reason.
      - name: Upload build and compliance reports
        uses: actions/upload-artifact@v7
        with:
          name: compliance-${{ matrix.python-version }}
          path: |
            dist/*
            sbom-${{ matrix.python-version }}.json
            pip-audit-${{ matrix.python-version }}.json
            runtime-pip-audit-${{ matrix.python-version }}.json
            licenses-${{ matrix.python-version }}.md
            quality-benchmark-${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 7

  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        shell: powershell
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "FFmpeg install failed (attempt $attempt); retrying..."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          throw "FFmpeg installation failed after 3 attempts."
      - name: Install lightweight quality test tools
        run: python -m pip install --upgrade pytest
      - name: Run deterministic benchmark on Windows
        run: python -m scripts.quality_benchmark --output quality-benchmark-windows.json
      - name: Run portable and Windows harness tests
        run: >-
          python -m pytest -q
          tests/test_otio_export.py
          tests/test_quality_benchmark.py
          tests/test_stream_guard.py
          tests/test_stream_guard_downloads.py
          tests/test_windows_acceptance.py
          tests/test_windows_diagnostics.py
          tests/test_windows_launchers.py
          -k "not core_pipeline_real_ffmpeg and not generated_clip_carries_the_planted_silence"
      - name: Upload Windows quality report
        uses: actions/upload-artifact@v7
        with:
          name: quality-windows
          path: quality-benchmark-windows.json
          if-no-files-found: warn
          retention-days: 7
