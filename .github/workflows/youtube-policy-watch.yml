name: YouTube Policy Watch

# Watches YouTube's official policy pages (Hate speech, Harassment, Violent &
# graphic, Community Guidelines). When a page changes, the moderation
# vocabulary has changed — so the safety blocklist (safety_blocklist.json)
# needs a maintainer review. This workflow:
#
#   * Runs every day (09:00 UTC) and on manual dispatch.
#   * Runs scripts/github_policy_watch_ci.py which compares page hashes.
#   * If any policy page changed → opens ONE reminder issue (skipped if one
#     is already open) listing exactly which policy areas changed.

on:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC
  workflow_dispatch:

concurrency:
  group: policy-watch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run the policy watcher
        id: watch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/github_policy_watch_ci.py

      - name: Open reminder issue when a policy page changed
        if: steps.watch.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_CHANGES: ${{ steps.watch.outputs.changes }}
          WATCH_MARKERS: ${{ steps.watch.outputs.markers }}
        run: |
          set -euo pipefail
          CHANGES="$WATCH_CHANGES"
          MARKERS="$WATCH_MARKERS"
          OPEN=$(gh issue list --state open --search 'in:title "YouTube-Policy-Change"' --limit 5 --json number -q '.[].number')
          if [ -n "$OPEN" ]; then
            echo "Reminder issue already open (#$OPEN)."
          else
            gh issue create \
              --title "[YouTube-Policy-Change] تغيّرت سياسات يوتيوب ($CHANGES) — راجع قائمة الأمان" \
              --body "## 🔔 تم رصد تغيير في صفحات سياسات يوتيوب الرسمية

          التغيير في: **$CHANGES**

          ### ماذا يعني هذا
          يوتيوب يعدّل صفحاته الرسمية عندما يتغير أسلوب التطبيق — وهذا يترجم غالباً إلى كلمات/عبارات جديدة يجب أن تصل إلى \`safety_blocklist.json\`.

          ### مقتطفات من الصفحات المتغيرة
          $MARKERS

          ### ماذا تفعل
          1. راجع الصفحات المذكورة أعلاه.
          2. أضف أي كلمات جديدة إلى قائمة \`BLOCKLIST\` في \`scripts/safety_filter.py\`.
          3. صدّر الحزمة برقم إصدار جديد:
             \`\`\`
             python scripts/export_blocklist_pack.py --version 5
             \`\`\`
          4. ادفع التغيير — وستتلقى كل التثبيتات التحديث خلال 24 ساعة."
          fi
