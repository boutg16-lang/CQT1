# Dependency update automation.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Python packages (requirements*.txt / pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Heavy AI stacks are environment-sensitive and must be upgraded as a
    # coordinated, tested set rather than one package at a time.
    #
    # Hard pins documented in the codebase — do not let Dependabot re-propose
    # updates that violate them:
    #   * numpy<2 — whisperx/pyannote break on NumPy 2.x (np.NaN removed);
    #     see requirements.txt / requirements-transcribe.txt.
    #   * onnxruntime<1.24 — retained for the supported WhisperX/ONNX stack;
    #     see pyproject.toml.
    #   * huggingface-hub<2.0 — project floor is 1.16.0 for the current
    #     Transformers/Gradio stack; see requirements-transcribe.txt.
    #   * tokenizers<0.23.1 — Transformers 5.14–5.15 accepts <=0.23.0, and
    #     0.23.0 was never released on PyPI. See requirements-transcribe.txt.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2"]
      - dependency-name: "onnxruntime"
        versions: [">=1.24"]
      - dependency-name: "huggingface-hub"
        versions: [">=2.0"]
      - dependency-name: "tokenizers"
        versions: [">=0.23.1"]
      # These packages form one tested transcription compatibility contract.
      # Ignore version updates only; security update PRs remain enabled.
      # Versions are mirrored in installers, diagnostics, preflight, and tests.
      - dependency-name: "torch"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "torchaudio"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "torchvision"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "whisperx"
      - dependency-name: "transformers"
      - dependency-name: "setuptools"

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
