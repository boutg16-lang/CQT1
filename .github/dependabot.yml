# Dependency update automation.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Python packages (requirements*.txt / pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Heavy AI stacks (torch/whisperx) are environment-sensitive — review
    # those PRs manually instead of auto-merging anything.
    #
    # Hard pins documented in the codebase — do not let Dependabot re-propose
    # updates that violate them:
    #   * numpy<2 — whisperx/pyannote break on NumPy 2.x (np.NaN removed);
    #     see requirements.txt / requirements-transcribe.txt.
    #   * onnxruntime<1.24 — 1.24+ drops Python 3.10 wheels while the project
    #     supports 3.10–3.12; see pyproject.toml.
    #   * huggingface-hub<2.0 — project floor is 1.16.0 for the current
    #     Transformers/Gradio stack; see requirements-transcribe.txt.
    #   * tokenizers<0.23.1 — Transformers 5.14–5.15 accepts <=0.23.0, and
    #     0.23.0 was never released on PyPI. See requirements-transcribe.txt.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2"]
      - dependency-name: "onnxruntime"
        versions: [">=1.24"]
      - dependency-name: "huggingface-hub"
        versions: [">=2.0"]
      - dependency-name: "tokenizers"
        versions: [">=0.23.1"]

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
